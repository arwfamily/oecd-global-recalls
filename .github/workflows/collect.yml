name: Collect OECD GlobalRecalls feed

on:
  schedule:
    - cron: "23 5 * * *"
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      run_backfill:
        description: "Also run the 2000-> historical backfill (5h). Leave false for a normal manual run."
        type: boolean
        default: false

permissions:
  contents: write

# Layer 1 of 3: do not race. Every push rejection this repo has suffered
# came from the daily job and the backfill job writing main at the same
# time. Serialise them and the rebase path is almost never entered.
concurrency:
  group: oecd-recalls-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a shallow clone has no rebase base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: chmod +x scripts/git_publish.sh

      - name: Run OECD collector
        run: python collect_oecd.py
      - name: Run Canada collector
        run: python collect_canada.py
      - name: Run US collector
        run: python collect_us.py
      - name: Run EU collector
        run: python collect_eu.py
      - name: Run KR collector
        env:
          PYTHONUNBUFFERED: "1"
        run: python collect_kr_seoul.py
      - name: Build baby view
        run: python build_baby_view.py

      - name: Publish
        run: |
          scripts/git_publish.sh "collect: $(date -u +%Y-%m-%d) feed snapshot" data/

      # Layer 3 of 3: a persistence path that does not involve git at all.
      # Runs even when everything above failed, so a run can never end with
      # collected data existing nowhere.
      - name: Safety net - upload data regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-collect-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: warn

  backfill-oecd:
    # 2026-08-21 decision: the daily feed is the asset; historical backfill
    # is not time-sensitive (those recalls are not going anywhere) and every
    # persistence failure so far has come from this job. It now runs only
    # when explicitly asked for, so pressing "Run workflow" is always safe.
    if: inputs.run_backfill
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: chmod +x scripts/git_publish.sh

      - name: Guard - fail in 5 seconds, not after 5 hours
        run: |
          git symbolic-ref -q HEAD >/dev/null \
            || { echo "::error::detached HEAD at start of a long run"; exit 1; }
          test -x scripts/git_publish.sh \
            || { echo "::error::scripts/git_publish.sh missing or not executable"; exit 1; }

      - name: Backfill OECD registry (2000 -> today)
        env:
          PYTHONUNBUFFERED: "1"
        run: python backfill_oecd.py

      - name: Publish
        run: |
          scripts/git_publish.sh "backfill: OECD registry" data/

      - name: Safety net - upload data regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-backfill-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: warn



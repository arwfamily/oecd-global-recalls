name: Collect OECD GlobalRecalls feed

on:
  schedule:
    # Feed TTL is 1440 min (daily). Run twice a day so one failed run
    # never costs us a day of a 7-day rolling window.
    - cron: "23 5 * * *"
    - cron: "23 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run OECD collector
        run: python collect_oecd.py

      - name: Run Canada collector
        run: python collect_canada.py

      - name: Run US collector
        # Adapts tinysafe-data's published recalls_full.jsonl — never
        # re-fetches CPSC/FDA/NHTSA, so there is exactly one US pipeline.
        run: python collect_us.py

      - name: Run EU collector
        # Safety Gate weekly-report XML. Walks report ids with a per-run
        # budget; the same walk is the daily sync and the 2005+ backfill,
        # resuming from eu_state.json every run.
        run: python collect_eu.py

      - name: Run KR collector
        # Seoul mirror of safetykorea (제품안전정보센터) — zero-auth GET
        # pagination, walks the displayed 3-year window every run; the
        # canonical store only grows, so history accrues from today.
        env:
          PYTHONUNBUFFERED: "1"
        run: python collect_kr_seoul.py

      - name: Build baby view
        # Derives data/views/baby.jsonl from every canonical store.
        # The view is disposable output rebuilt from scratch each run;
        # the canonicals are the asset. Rules live in build_baby_view.py.
        run: python build_baby_view.py

      - name: Commit results
        run: |
          git config user.name "oecd-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "collect: $(date -u +%Y-%m-%d) feed snapshot"
            git push
          fi

  backfill-oecd:
    # Manual one-shot: Actions 탭 → Run workflow 로만 실행됨.
    # 2000년~ 전체 OECD 레지스트리 백필 (연도별 체크포인트, 재실행 안전).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill OECD registry (2000 -> today)
        env:
          PYTHONUNBUFFERED: "1"
        run: python backfill_oecd.py
      - name: Commit
        run: |
          git config user.name "oecd-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "backfill: OECD registry"
          git push

